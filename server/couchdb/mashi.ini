; Mashi – CouchDB-Einstellungen
; Wird nach /opt/couchdb/etc/local.d/ eingebunden und beim Start gelesen.
; Nach Änderungen: docker compose restart couchdb

[couchdb]
; Ein einzelner Server, kein Cluster. Legt die Systemdatenbanken (_users, _replicator)
; beim ersten Start automatisch an.
single_node = true
; Rezepte enthalten Fotos als eingebettete Daten (verkleinert, meist < 200 KB).
; 8 MB je Dokument lassen reichlich Luft.
max_document_size = 8000000

[cluster]
; Einzelserver: jede Datenbank einmal speichern statt der Cluster-Vorgabe von 3 Kopien.
n = 1

[chttpd]
; Ohne Anmeldung kommt niemand an irgendetwas heran – auch nicht an die Server-Infos.
require_valid_user = true
enable_cors = true

[chttpd_auth]
require_valid_user = true

[cors]
; Von welchen Web-Adressen aus die Mashi-App die Datenbank ansprechen darf.
; Nur der Ursprung (ohne Pfad!), also NICHT https://dschudschuu.github.io/mashi
; http://localhost:5173 ist der Entwicklungsserver auf Julias Rechner – kann später raus.
origins = https://dschudschuu.github.io, http://localhost:5173
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer
max_age = 3600
