# Mashi auf Coolify: CouchDB + KI-Dienst (siehe ANLEITUNG.md im selben Ordner).
#
# !! In die BESTEHENDE Coolify-Ressource einfügen (Edit Compose File → Save → Redeploy),
# !! NICHT als neue Ressource anlegen – sonst entsteht ein neues, LEERES Volume.
# !! Service-Name „couchdb“ und Volume „mashi-couchdb-data“ nie umbenennen.
#
# Diese Datei wird erzeugt: node server/coolify/build-compose.mjs (Code aus server/ki/ki.mjs).
# Nicht von Hand ändern. Labels, Netzwerke, Ports, restart und container_name setzt Coolify selbst.
services:
  couchdb:
    image: couchdb:3.5
    environment:
      - SERVICE_FQDN_COUCHDB_5984
      - COUCHDB_USER=${SERVICE_USER_COUCHDB}
      - COUCHDB_PASSWORD=${SERVICE_PASSWORD_64_COUCHDB}
    volumes:
      - mashi-couchdb-data:/opt/couchdb/data
      - type: bind
        source: ./mashi.ini
        target: /opt/couchdb/etc/local.d/mashi.ini
        content: |
          ; Mashi – CouchDB-Einstellungen
          ; Wird nach /opt/couchdb/etc/local.d/ eingebunden und beim Start gelesen.
          ; Nach Änderungen: docker compose restart couchdb

          [couchdb]
          ; Ein einzelner Server, kein Cluster. Legt die Systemdatenbanken (_users, _replicator)
          ; beim ersten Start automatisch an.
          single_node = true
          ; Rezepte enthalten Fotos als eingebettete Daten (verkleinert, meist < 200 KB).
          ; 8 MB je Dokument lassen reichlich Luft.
          max_document_size = 8000000

          [cluster]
          ; Einzelserver: jede Datenbank einmal speichern statt der Cluster-Vorgabe von 3 Kopien.
          n = 1

          [chttpd]
          ; Ohne Anmeldung kommt niemand an irgendetwas heran – auch nicht an die Server-Infos.
          require_valid_user = true
          ; Ausnahme nur /_up (Lebenszeichen, verrät nichts) – für Healthchecks
          require_valid_user_except_for_up = true
          enable_cors = true

          [chttpd_auth]
          require_valid_user = true

          [httpd]
          ; Ohne diesen Kopf fragt der Browser bei Fauxton (/_utils) nicht nach Benutzer und Passwort
          WWW-Authenticate = Basic realm="couchdb"

          [cors]
          ; Von welchen Web-Adressen aus die Mashi-App die Datenbank ansprechen darf.
          ; Nur der Ursprung (ohne Pfad!), also NICHT https://dschudschuu.github.io/mashi
          ; http://localhost:5173 ist der Entwicklungsserver auf Julias Rechner – kann später raus.
          origins = https://dschudschuu.github.io, http://localhost:5173
          credentials = true
          methods = GET, PUT, POST, HEAD, DELETE
          headers = accept, authorization, content-type, origin, referer
          max_age = 3600
    # /_up antwortet ohne Anmeldung (require_valid_user_except_for_up); curl ist im Image
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5984/_up > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # KI-Rezepte: Vermittler zu OpenRouter. Domain in Coolify: https://<DB-DOMAIN>:8080/ki
  # In Coolify nur OPENROUTER_API_KEY und OPENROUTER_MODEL eintragen – der Rest hat Standardwerte.
  # Ohne Schlüssel läuft der Dienst trotzdem und meldet „nicht eingerichtet“.
  # Einkauf planen braucht pdftotext und pdftohtml (poppler: Prospekt-PDF → Text, für Lidl-Preise mit Lage auf der
  # Seite). node:24-alpine hat sie nicht, ein eigenes Image
  # müsste Coolify bauen – deshalb installiert der Dienst es bei jedem Start selbst (dafür kurz als root)
  # und läuft danach wie vorher als einfacher Benutzer node. Klappt die Installation nicht (kein Netz),
  # startet er trotzdem; nur „Angebote holen“ meldet dann, dass pdftotext fehlt.
  ki:
    image: node:24-alpine
    user: root
    command: ["sh", "-c", "apk add --no-cache --quiet poppler-utils || echo 'pdftotext liess sich nicht installieren'; exec su -s /bin/sh node -c 'exec node /app/ki.mjs'"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - COUCHDB_URL=${COUCHDB_URL:-http://couchdb:5984}
      - KI_ALLOWED_ORIGINS=${KI_ALLOWED_ORIGINS:-https://dschudschuu.github.io}
      - KI_PER_HOUR=${KI_PER_HOUR:-20}
      - KI_PER_DAY=${KI_PER_DAY:-60}
    volumes:
      - type: bind
        source: ./ki.mjs
        target: /app/ki.mjs
        content: |
          // Mashi-KI: kleiner Vermittler zwischen der App und OpenRouter.
          //
          // Warum ein Server: Mashi liegt öffentlich auf GitHub Pages – ein API-Schlüssel im App-Code wäre für
          // jeden lesbar. Hier liegt er nur in den Umgebungsvariablen des Servers (Coolify). Nutzen darf ihn nur, wer sich an der
          // Mashi-CouchDB anmelden kann (dieselbe Anmeldung wie der Abgleich) – geprüft über /_session.
          //
          // Bewusst ohne Pakete (nur Node): nichts zu installieren, wenig Angriffsfläche.
          // Diese Datei steht wörtlich in ../coolify/docker-compose.yml (per content:) – darum KEIN Dollar-Zeichen
          // vor Klammer oder Buchstabe (keine Template-Strings mit Platzhaltern): Compose/Coolify würden das als
          // eigene Variable ersetzen, und der Code wäre still kaputt. Ein Test prüft das.
          // Nur Rezepte: feste Anweisung, Grenzen für Länge und Antwort, Anfragen je Person begrenzt.
          //
          // Wege: POST /rezept, POST /prospekttext, GET /status – jeweils auch mit /ki davor (Coolify schneidet das Präfix
          // standardmäßig ab, ohne „Strip Prefixes“ kommt es mit). Folge: eine CouchDB-Datenbank namens „ki“ ist nicht möglich.
          //
          // /prospekttext (Einkauf planen): holt ein Prospekt-PDF von Lidl/Kaufland (nur assets.leaflets.schwarz) und gibt den
          // Text je Seite zurück – ohne KI, mit poppler (pdftotext/pdftohtml, installiert die Compose-Datei beim Start). Auf
          // Wunsch (layout) dazu die Wörter mit Lage und Schrift: daraus liest die App die Lidl-Preise. So lädt das Handy
          // nur ~100 KB statt 20–60 MB PDF. Ausgewertet wird alles in der App.
          //
          // Umgebung (in Coolify unter Environment Variables, siehe ../coolify/ANLEITUNG.md):
          //   OPENROUTER_API_KEY   Schlüssel von openrouter.ai (Pflicht)
          //   OPENROUTER_MODEL     z. B. ein Modell mit „:free“ (Pflicht)
          //   COUCHDB_URL          intern, Standard http://couchdb:5984
          //   KI_ALLOWED_ORIGINS   erlaubte Herkunft der App, Komma-getrennt (früher MASHI_APP_ORIGINS)
          //   KI_PER_HOUR / KI_PER_DAY   Anfragen je Person (Standard 20 / 60)
          //   PORT                 Standard 8080

          import { execFile } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { createServer } from 'node:http';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { gzipSync } from 'node:zlib';

          export const SYSTEM_PROMPT =
            'Du bist der Rezept-Assistent der Koch-App Mashi. Du hilfst ausschließlich beim Erstellen von Kochrezepten. ' +
            'Antworte immer nur mit einem einzigen JSON-Objekt im verlangten Aufbau, ohne Text davor oder danach. ' +
            'Bei Anfragen, die nichts mit Kochen zu tun haben, antworte mit {"error": "nur Rezepte"}.';

          /** höchstens so viel Auftrag (Zeichen) – lange Vorlieben (bis 10 000) passen mit dem Rest hinein */
          export const MAX_PROMPT = 16000;
          /** Bytes – Umlaute brauchen in UTF-8 und JSON mehr Platz als ein Zeichen */
          const MAX_BODY = 64 * 1024;
          /**
           * Beim Beenden (docker stop, Redeploy) so lange dürfen laufende Anfragen noch fertig werden. Deutlich unter den
           * 10 s, nach denen Docker selbst mit SIGKILL nachhilft – sonst endete der Dienst doch wieder mit Exit 137.
           */
          const STOP_GRACE_MS = 5000;

          /** Anfragen je Person: gleitende Fenster für Stunde und Tag, nur im Speicher (ein Neustart setzt zurück) */
          export class RateLimiter {
            constructor(perHour = 20, perDay = 60) {
              this.perHour = perHour;
              this.perDay = perDay;
              /** @type {Map<string, number[]>} */
              this.hits = new Map();
            }
            /** true = erlaubt (und gezählt) */
            take(user, now = Date.now()) {
              const day = 24 * 3600 * 1000;
              const list = (this.hits.get(user) ?? []).filter((t) => now - t < day);
              const lastHour = list.filter((t) => now - t < 3600 * 1000).length;
              if (list.length >= this.perDay || lastHour >= this.perHour) {
                this.hits.set(user, list);
                return false;
              }
              list.push(now);
              this.hits.set(user, list);
              return true;
            }
            /** die zuletzt gezählte Anfrage zurückgeben – die KI hat nicht geantwortet, das soll kein Kontingent kosten */
            giveBack(user) {
              const list = this.hits.get(user);
              if (list?.length) list.pop();
            }
          }

          /**
           * Falsche Anmeldungen je Herkunft (IP) begrenzen (Code-Review #8): nach zu vielen in kurzer Zeit eine Pause, ohne
           * die Datenbank überhaupt zu fragen – sonst ließen sich über diesen Dienst Passwörter beliebig oft durchprobieren.
           */
          export class FailLimiter {
            constructor(max = 10, windowMs = 15 * 60 * 1000) {
              this.max = max;
              this.windowMs = windowMs;
              /** @type {Map<string, number[]>} */
              this.fails = new Map();
            }
            recent(ip, now) {
              return (this.fails.get(ip) ?? []).filter((t) => now - t < this.windowMs);
            }
            /** true = Pause (zu viele Fehlversuche) */
            blocked(ip, now = Date.now()) {
              return this.recent(ip, now).length >= this.max;
            }
            fail(ip, now = Date.now()) {
              this.fails.set(ip, [...this.recent(ip, now), now]);
              // nicht unbegrenzt wachsen: abgelaufene Adressen gelegentlich wegräumen
              if (this.fails.size > 5000) for (const [k] of this.fails) if (!this.recent(k, now).length) this.fails.delete(k);
            }
          }

          /** Herkunft der Anfrage: Traefik trägt die echte Adresse in X-Forwarded-For ein (erste Angabe), sonst der direkte Absender */
          export const clientIp = (headers, remote) => String(headers['x-forwarded-for'] ?? '').split(',')[0].trim() || remote || '?';

          /**
           * Den ganzen Inhalt einer Anfrage lesen – als Bytes sammeln und erst am Ende als UTF-8 lesen (Code-Review #7):
           * Stückweise gelesen wurde ein Umlaut, dessen Bytes auf zwei Stücke fielen, zu zwei Ersatzzeichen („K??se“).
           * Zu groß: der Rest wird nur noch verworfen, damit die Antwort (413 mit CORS) noch ankommt.
           */
          export function readBody(req, max = MAX_BODY) {
            return new Promise((resolve, reject) => {
              const chunks = [];
              let size = 0;
              let tooBig = false;
              req.on('data', (chunk) => {
                if (tooBig) return;
                const buf = Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk);
                size += buf.length;
                if (size > max) { tooBig = true; chunks.length = 0; return; }
                chunks.push(buf);
              });
              req.on('end', () => resolve(tooBig ? { tooBig: true } : { tooBig: false, body: Buffer.concat(chunks).toString('utf8') }));
              req.on('error', reject);
            });
          }

          /** Herkunft erlaubt? Dann genau diese zurückschreiben (nie „*“, weil mit Anmeldung) */
          export function corsHeaders(origin, allowed) {
            if (!origin || !allowed.includes(origin)) return {};
            return {
              'Access-Control-Allow-Origin': origin,
              'Access-Control-Allow-Methods': 'POST, GET, OPTIONS',
              'Access-Control-Allow-Headers': 'authorization, content-type',
              'Access-Control-Max-Age': '3600',
              Vary: 'Origin',
            };
          }

          /**
           * Wer fragt? Die Anmeldung (Basic) geht unverändert an CouchDB /_session – nur wer dort gilt, darf.
           * Ergebnis 1 Minute merken (als Hash, nie das Passwort selbst), damit nicht jede Anfrage die DB fragt – kurz, damit
           * ein geändertes Passwort oder ein gelöschter Zugang bald nicht mehr gilt (Code-Review #13).
           * null = Anmeldung falsch; wirft, wenn die Datenbank nicht antwortet (dann 503 statt „falsche Anmeldung“).
           */
          export function makeAuth({ fetch, couchUrl, ttl = 60 * 1000 }) {
            /** @type {Map<string, {name: string, until: number}>} */
            const cache = new Map();
            return async function userOf(authorization, now = Date.now()) {
              if (!authorization || !/^Basic\s+\S+$/i.test(authorization)) return null;
              const key = createHash('sha256').update(authorization).digest('hex');
              const hit = cache.get(key);
              if (hit && hit.until > now) return hit.name;
              const res = await fetch(couchUrl + '/_session', { headers: { authorization, accept: 'application/json' } });
              if (res.status >= 500) throw new Error('CouchDB antwortet nicht (' + res.status + ')');
              if (!res.ok) return null;
              const body = await res.json().catch(() => null);
              const name = body?.userCtx?.name;
              if (!name) return null;
              cache.set(key, { name, until: now + ttl });
              return name;
            };
          }

          /** Auftrag an OpenRouter (OpenAI-kompatibel); gibt den Text der Antwort zurück */
          export async function askModel({ fetch, apiKey, model, baseUrl = 'https://openrouter.ai/api/v1', prompt, timeoutMs = 90_000 }) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
              const res = await fetch(baseUrl + '/chat/completions', {
                method: 'POST',
                signal: ctrl.signal,
                headers: { authorization: 'Bearer ' + apiKey, 'content-type': 'application/json', 'x-title': 'Mashi' },
                body: JSON.stringify({
                  model,
                  messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: prompt }],
                  max_tokens: 2500,
                  temperature: 0.7,
                }),
              });
              if (res.status === 429) return { status: 429 };
              if (!res.ok) return { status: 502 };
              const body = await res.json().catch(() => null);
              const text = body?.choices?.[0]?.message?.content;
              return typeof text === 'string' && text.trim() ? { status: 200, text, model: body.model ?? model } : { status: 502 };
            } catch {
              return { status: 504 };
            } finally {
              clearTimeout(timer);
            }
          }

          // ── Prospekte lesen (Einkauf planen) ─────────────────────────────

          /** Prospekt-PDFs nur von hier – der Server holt nichts anderes (sonst wäre er ein offener Abruf-Dienst) */
          export const PDF_PREFIX = 'https://assets.leaflets.schwarz/';
          /** größer ist kein Wochenprospekt (Kaufland „Familie“: 62 MB) */
          const MAX_PDF = 150 * 1024 * 1024;
          const MAX_PAGES = 200;
          const MAX_PAGE_CHARS = 20000;

          /** Adresse erlaubt? Nur https, nur PDF_PREFIX, nur .pdf, keine Anmeldedaten in der Adresse */
          export function pdfUrlOk(url) {
            try {
              const u = new URL(url);
              return u.protocol === 'https:' && u.href.startsWith(PDF_PREFIX) && u.pathname.endsWith('.pdf') && !u.username && !u.password;
            } catch {
              return false;
            }
          }

          /**
           * PDF holen – ohne Weiterleitungen (die könnten woandershin führen), mit Zeit- und Größengrenze. Stückweise gelesen,
           * damit eine falsche Längenangabe den Speicher nicht sprengt.
           */
          export async function fetchPdf({ fetch, url, timeoutMs = 60_000, max = MAX_PDF }) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
              const res = await fetch(url, { signal: ctrl.signal, redirect: 'error' });
              // 403/404: diese Fassung gibt es nicht mehr (Lidl lädt Prospekte unter neuem Namen neu hoch)
              if (res.status === 403 || res.status === 404) return { status: 404 };
              if (!res.ok || !res.body) return { status: 502 };
              if (Number(res.headers.get('content-length') || 0) > max) return { status: 413 };
              const reader = res.body.getReader();
              const chunks = [];
              let size = 0;
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                size += value.length;
                if (size > max) {
                  ctrl.abort();
                  return { status: 413 };
                }
                chunks.push(value);
              }
              return { status: 200, data: Buffer.concat(chunks) };
            } catch {
              return { status: 504 };
            } finally {
              clearTimeout(timer);
            }
          }

          /** höchstens so viele Wörter je Seite (eine volle Lidl-Seite hat ~500) */
          const MAX_PAGE_WORDS = 4000;

          const run = (cmd, args, timeoutMs) => new Promise((resolve, reject) => {
            execFile(cmd, args, { timeout: timeoutMs, maxBuffer: 64 * 1024 * 1024 }, (err, stdout) => (err ? reject(err) : resolve(String(stdout))));
          });

          /** Text aus XML/XHTML von poppler: Auszeichnungen weg, Zeichen-Ersetzungen zurück */
          const xmlText = (s) => s.replace(/<[^>]+>/g, '').replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
            .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
          const r1 = (n) => Math.round(n * 10) / 10;

          /**
           * Wörter mit Lage und Schrift – für die Lidl-Preise (die App ordnet Preis und Artikel über die Lage zu, siehe
           * src/domain/leafletPrices.ts). Zwei poppler-Programme, weil keines allein alles richtig liefert:
           * - pdftotext -bbox: Wörter mit genauen Grenzen („Leber|käse“ berühren sich = ein Wort mit Trennstelle),
           * - pdftohtml -xml: Schriftart und -größe je Textstück (Preise, Statt-Preise, Überschriften unterscheiden sich daran).
           * Beide rechnen mit derselben Textanalyse, die Lage stimmt darum genau überein.
           * @returns {{fonts: [number, string][], pages: [string, number, number, number, number, number][][]}}
           *   Wort = [Text, links, oben, Breite, Höhe, Schrift-Nr. (-1 = unbekannt)], alles in PDF-Punkten
           */
          export function wordsWithFonts(bboxHtml, pdftohtmlXml) {
            const fonts = [];
            const fontIdx = new Map();
            for (const m of pdftohtmlXml.matchAll(/<fontspec id="(\d+)" size="([\d.-]+)" family="([^"]*)"/g)) {
              fontIdx.set(m[1], fonts.length);
              fonts.push([Number(m[2]), m[3]]);
            }
            const runsOf = new Map();
            for (const pm of pdftohtmlXml.matchAll(/<page number="(\d+)"[^>]*>([\s\S]*?)<\/page>/g)) {
              const runs = [];
              for (const m of pm[2].matchAll(/<text top="([\d.-]+)" left="([\d.-]+)" width="([\d.-]+)" height="([\d.-]+)" font="(\d+)">([\s\S]*?)<\/text>/g)) {
                // leere Stücke (nur ein Leerzeichen) überspringen – sie liegen oft direkt vor einem Preis in kleiner Schrift
                if (!xmlText(m[6]).trim()) continue;
                runs.push({ top: Number(m[1]), left: Number(m[2]), right: Number(m[2]) + Number(m[3]), height: Number(m[4]), font: fontIdx.get(m[5]) ?? -1 });
              }
              runsOf.set(Number(pm[1]), runs);
            }
            const pages = [];
            let n = 0;
            for (const pm of bboxHtml.matchAll(/<page width="[\d.]+" height="[\d.]+">([\s\S]*?)<\/page>/g)) {
              n++;
              if (n > MAX_PAGES) break;
              const runs = runsOf.get(n) ?? [];
              const words = [];
              for (const m of pm[1].matchAll(/<word xMin="([\d.-]+)" yMin="([\d.-]+)" xMax="([\d.-]+)" yMax="([\d.-]+)">([\s\S]*?)<\/word>/g)) {
                const text = xmlText(m[5]);
                if (!text.trim() || words.length >= MAX_PAGE_WORDS) continue;
                const x0 = Number(m[1]), y0 = Number(m[2]), x1 = Number(m[3]), y1 = Number(m[4]);
                // Schrift: das Stück derselben Zeile und Höhe, in dem das Wort beginnt
                const hit = runs.find((r) => Math.abs(r.top - y0) < 0.6 && Math.abs(r.height - (y1 - y0)) < 0.6 && x0 >= r.left - 0.6 && x0 <= r.right + 0.6);
                words.push([text, r1(x0), r1(y0), r1(x1 - x0), r1(y1 - y0), hit ? hit.font : -1]);
              }
              pages.push(words);
            }
            return { fonts, pages };
          }

          /**
           * Prospekt lesen: Text je Seite (pdftotext trennt Seiten mit einem Seitenvorschub), auf Wunsch dazu die Wörter mit
           * Lage und Schrift (für Preise, nur Lidl). Alles poppler – installiert die Compose-Datei beim Start.
           */
          export async function readPdf(data, { layout = false, timeoutMs = 60_000 } = {}) {
            const dir = await mkdtemp(join(tmpdir(), 'mashi-pdf-'));
            const file = join(dir, 'prospekt.pdf');
            try {
              await writeFile(file, data);
              const text = await run('pdftotext', ['-enc', 'UTF-8', '-q', file, '-'], timeoutMs);
              const pages = text.split('\f');
              // nach dem letzten Seitenvorschub steht nichts mehr
              if (pages.length > 1 && !pages[pages.length - 1].trim()) pages.pop();
              const out = { pages: pages.slice(0, MAX_PAGES).map((p) => p.slice(0, MAX_PAGE_CHARS)) };
              if (layout) {
                const [bbox, xml] = await Promise.all([
                  run('pdftotext', ['-bbox', '-enc', 'UTF-8', '-q', file, '-'], timeoutMs),
                  // -zoom 1: Punkte wie im PDF; -noroundcoord: genaue Lage (sonst ganze Zahlen)
                  run('pdftohtml', ['-xml', '-i', '-q', '-zoom', '1', '-noroundcoord', '-stdout', file], timeoutMs),
                ]);
                out.layout = wordsWithFonts(bbox, xml);
              }
              return out;
            } finally {
              await rm(dir, { recursive: true, force: true });
            }
          }

          /**
           * Große Antworten gepackt schicken, wenn der Browser es kann (alle können) – die Wörter eines Lidl-Prospekts sind
           * ~450 KB, gepackt ~80 KB. Kleine Antworten bleiben, wie sie sind.
           */
          export function encodeBody(json, acceptEncoding) {
            if (json.length < 16 * 1024 || !/\bgzip\b/.test(acceptEncoding || '')) return { data: json, headers: {} };
            return { data: gzipSync(json), headers: { 'Content-Encoding': 'gzip' } };
          }

          /** Der ganze Ablauf einer Anfrage – ohne Netzwerk-Server, damit er sich testen lässt */
          /** „/ki/rezept“ und „/rezept“ sind derselbe Weg (Coolify schneidet /ki meist ab) */
          export const routeOf = (path) => path.replace(/^\/ki(?=\/|$)/, '').replace(/\/+$/, '') || '/';

          export function makeHandler({
            fetch, env, limiter = new RateLimiter(Number(env.KI_PER_HOUR) || 20, Number(env.KI_PER_DAY) || 60), fails = new FailLimiter(),
            // Prospekte: eigenes Kontingent (kostet keine KI, aber Bandbreite), das Lesen (poppler) austauschbar für die Tests
            pdfLimiter = new RateLimiter(20, 40), pdfReader = readPdf, now = () => Date.now(),
          }) {
            const allowed = (env.KI_ALLOWED_ORIGINS || env.MASHI_APP_ORIGINS || 'https://dschudschuu.github.io,http://localhost:5173').split(',').map((s) => s.trim()).filter(Boolean);
            const userOf = makeAuth({ fetch, couchUrl: (env.COUCHDB_URL || 'http://couchdb:5984').replace(/\/+$/, '') });
            const configured = !!(env.OPENROUTER_API_KEY && env.OPENROUTER_MODEL);
            /** gelesene Prospekte (Adresse → Seiten) – zweimal tippen lädt nicht zweimal 40 MB; wenige, nur einen halben Tag */
            const pdfCache = new Map();
            const PDF_CACHE_MS = 12 * 3600 * 1000;
            const PDF_CACHE_SIZE = 8;

            /** POST /prospekttext – {url, layout?} → {pages: string[], layout?: {fonts, pages}} (layout: Wörter mit Lage, für Preise) */
            async function prospektText(user, body, reply) {
              let url, layout;
              try { ({ url, layout } = JSON.parse(body)); } catch { return reply(400, { error: 'kein JSON' }); }
              if (typeof url !== 'string' || !pdfUrlOk(url)) return reply(400, { error: 'adresse', message: 'Nur Prospekte von Lidl und Kaufland.' });
              layout = layout === true;
              const key = (layout ? 'layout ' : '') + url;
              const hit = pdfCache.get(key);
              if (hit && hit.until > now()) return reply(200, hit.out);
              if (!pdfLimiter.take(user)) return reply(429, { error: 'limit', message: 'Für heute sind genug Prospekte gelesen – später wieder.' });
              const pdf = await fetchPdf({ fetch, url });
              if (pdf.status !== 200) {
                pdfLimiter.giveBack(user);
                if (pdf.status === 404) return reply(404, { error: 'prospekt', message: 'Diesen Prospekt gibt es so nicht mehr – bitte noch einmal holen.' });
                if (pdf.status === 413) return reply(413, { error: 'zu groß', message: 'Der Prospekt ist zu groß zum Lesen.' });
                return reply(502, { error: 'laden', message: 'Der Prospekt ließ sich gerade nicht laden – später noch mal.' });
              }
              let out;
              try {
                out = await pdfReader(pdf.data, { layout });
              } catch (e) {
                pdfLimiter.giveBack(user);
                // poppler fehlt: alte Compose-Datei (installiert es nicht beim Start) oder die Installation ist gescheitert
                if (e && e.code === 'ENOENT') return reply(503, { error: 'pdftotext', message: 'Dein Server kann Prospekte noch nicht lesen (pdftotext fehlt) – siehe server/coolify/ANLEITUNG.md.' });
                return reply(502, { error: 'lesen', message: 'Der Prospekt ließ sich nicht lesen.' });
              }
              pdfCache.set(key, { out, until: now() + PDF_CACHE_MS });
              while (pdfCache.size > PDF_CACHE_SIZE) pdfCache.delete(pdfCache.keys().next().value);
              return reply(200, out);
            }

            /** @returns {Promise<{status: number, headers: Record<string,string>, body?: unknown}>} */
            async function handle({ method, path, headers, body, ip = '?' }) {
              const cors = corsHeaders(headers.origin, allowed);
              const reply = (status, payload) => ({ status, headers: { ...cors, 'content-type': 'application/json; charset=utf-8' }, body: payload });
              const route = routeOf(path);
              if (method === 'OPTIONS') return { status: 204, headers: cors };
              if (method === 'GET' && route === '/status') return reply(200, { ok: true, configured });
              if (method !== 'POST' || (route !== '/rezept' && route !== '/prospekttext')) return reply(404, { error: 'unbekannt' });
              // Prospekte lesen braucht keinen KI-Schlüssel
              if (route === '/rezept' && !configured) return reply(503, { error: 'nicht eingerichtet', message: 'Auf dem Server fehlt noch der KI-Schlüssel.' });

              if (fails.blocked(ip)) return reply(429, { error: 'zu viele', message: 'Zu viele falsche Anmeldungen – bitte in einer Viertelstunde noch mal.' });
              let user;
              try {
                user = await userOf(headers.authorization);
              } catch {
                return reply(503, { error: 'server', message: 'Die Anmeldung lässt sich gerade nicht prüfen – der Server ist kurz nicht erreichbar.' });
              }
              if (!user) {
                if (headers.authorization) fails.fail(ip); // nur echte Versuche zählen, nicht „noch nicht verbunden“
                return reply(401, { error: 'anmeldung', message: 'Bitte in Mashi mit dem Server verbinden.' });
              }
              if (typeof body !== 'string' || body.length > MAX_BODY) return reply(413, { error: 'zu groß' });
              if (route === '/prospekttext') return prospektText(user, body, reply);
              let prompt;
              try { prompt = JSON.parse(body).prompt; } catch { return reply(400, { error: 'kein JSON' }); }
              if (typeof prompt !== 'string' || !prompt.trim() || prompt.length > MAX_PROMPT) return reply(400, { error: 'auftrag' });
              if (!limiter.take(user)) return reply(429, { error: 'limit', message: 'Für heute sind genug Rezepte erstellt – später wieder.' });

              const out = await askModel({ fetch, apiKey: env.OPENROUTER_API_KEY, model: env.OPENROUTER_MODEL, baseUrl: env.OPENROUTER_BASE_URL, prompt });
              if (out.status === 200) return reply(200, { text: out.text, model: out.model });
              limiter.giveBack(user); // keine Antwort – kostet kein Kontingent (Code-Review #13)
              if (out.status === 429) return reply(429, { error: 'ausgelastet', message: 'Die kostenlose KI ist gerade ausgelastet – in ein paar Minuten noch mal.' });
              if (out.status === 504) return reply(504, { error: 'zeit', message: 'Die KI hat zu lange gebraucht.' });
              return reply(502, { error: 'ki', message: 'Die KI hat gerade nicht geantwortet.' });
            }
            /** CORS-Köpfe für Antworten außerhalb von handle (413, 500) – sonst meldet der Browser nur „offline?“ */
            handle.cors = (origin) => corsHeaders(origin, allowed);
            return handle;
          }

          /** Start als echter Server (nur, wenn die Datei direkt läuft – nicht in den Tests) */
          function start() {
            const handle = makeHandler({ fetch: globalThis.fetch, env: process.env });
            let stopping = false; // true, sobald SIGTERM/SIGINT da ist (siehe unten)
            const server = createServer(async (req, res) => {
              const json = { ...handle.cors(req.headers.origin), 'content-type': 'application/json; charset=utf-8' };
              const send = (out) => {
                // Beim Beenden die Verbindung nach dieser Antwort schließen: server.close() kappt nur Verbindungen, die beim
                // Aufruf schon ruhten – die einer laufenden Anfrage bliebe danach offen (Keep-alive), und der Dienst wartete
                // bis zur Frist. „Connection: close“ sagt zugleich Traefik, dass es sie nicht wiederverwenden soll.
                if (stopping) res.setHeader('connection', 'close');
                if (out.body === undefined) {
                  res.writeHead(out.status, out.headers);
                  return res.end();
                }
                const { data, headers } = encodeBody(JSON.stringify(out.body), req.headers['accept-encoding']);
                // Vary: Zwischenspeicher dürfen die gepackte Antwort nicht an jemanden geben, der sie nicht entpacken kann
                res.writeHead(out.status, { ...out.headers, ...headers, Vary: 'Origin, Accept-Encoding' });
                res.end(data);
              };
              const read = await readBody(req).catch(() => ({ tooBig: false, body: '' }));
              // auch hier mit CORS – sonst greift der „kürzer noch mal“-Versuch der App nie (Code-Review #13)
              if (read.tooBig) return send({ status: 413, headers: json, body: { error: 'zu groß' } });
              const path = new URL(req.url ?? '/', 'http://x').pathname;
              const ip = clientIp(req.headers, req.socket.remoteAddress);
              send(await handle({ method: req.method ?? 'GET', path, headers: req.headers, body: read.body, ip })
                .catch(() => ({ status: 500, headers: json, body: { error: 'server' } })));
            });
            const port = Number(process.env.PORT) || 8080;
            // 0.0.0.0: sonst erreicht der Proxy den Container nicht (Coolify: „No Available Server“)
            server.listen(port, '0.0.0.0', () => console.log('Mashi-KI hört auf 0.0.0.0:' + port + ' (Modell: ' + (process.env.OPENROUTER_MODEL || 'fehlt') + ')'));

            // Sauber beenden bei SIGTERM (docker stop, Coolify-Redeploy) und SIGINT (Strg+C beim Ausprobieren).
            // Warum nötig: Im Container ist node Prozess Nr. 1, und Signale ohne eigenen Handler ignoriert der Kernel für
            // Prozess Nr. 1 – Node installiert für SIGTERM keinen. Ohne diesen Block wartete docker stop 10 s und schoss den
            // Dienst dann mit SIGKILL ab (Exit 137, laufende Anfragen mitten drin gekappt).
            // Bewusst nicht per „init: true“ in der Compose-Datei gelöst: Dann stirbt node zwar sofort, aber am Signal
            // (Exit 143), ohne laufende Anfragen fertig zu machen – und die manuelle Variante (Dockerfile) hätte es nicht.
            const stop = (signal) => {
              if (stopping) return; // ein zweites Signal ändert nichts, das Beenden läuft schon
              stopping = true;
              console.log('Mashi-KI: ' + signal + ' – nehme nichts Neues mehr an und höre auf');
              // close(): keine neuen Verbindungen mehr. Ruhende Keep-alive-Verbindungen (Traefik hält welche offen) schließt
              // Node dabei selbst; laufende Anfragen werden noch beantwortet (send schließt danach). Sind alle zu, endet der
              // Dienst regulär.
              server.close(() => process.exit(0));
              // Eine KI-Antwort kann bis 90 s dauern – so lange wartet niemand. Nach der Frist die restlichen Verbindungen
              // kappen und trotzdem regulär enden: Beenden war ja gewollt, nur eben nicht ganz geräuschlos.
              setTimeout(() => {
                console.log('Mashi-KI: nach ' + STOP_GRACE_MS / 1000 + ' s noch offene Anfragen abgebrochen');
                server.closeAllConnections();
                process.exit(0);
              }, STOP_GRACE_MS);
            };
            process.on('SIGTERM', () => stop('SIGTERM'));
            process.on('SIGINT', () => stop('SIGINT'));
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) start();
    # Alpine hat kein curl – wget (BusyBox) ist dabei
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Start dauert wegen der Installation etwas länger
      start_period: 60s
    depends_on:
      - couchdb

volumes:
  mashi-couchdb-data:
